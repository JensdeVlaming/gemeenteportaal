services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    volumes:
      - ./backend:/app
      - ./backend/pb_data:/app/pb_data
    env_file:
      - .env
    ports:
      - "8093:8090"
    restart: unless-stopped

  frontend:
    image: node:20-alpine
    working_dir: /app
    command: sh -c "npm install && npm run build -- --watch --outDir /app/backend/pb_public --emptyOutDir"
    volumes:
      - ./frontend:/app
      - ./backend:/app/backend
      - /app/node_modules
    env_file:
      - .env
    depends_on:
      - backend

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8025:8025"
      - "1028:1025"
    restart: unless-stopped
